<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>

<body>

<h2>Add Flight</h2>

<input id="flight" placeholder="Flight No"><br><br>

<input id="dest" placeholder="Destination"><br><br>

<input id="time" placeholder="Departure"><br><br>

<button onclick="addFlight()">Add Flight</button>

<p>

<a href="login.html">Logout</a>

</p>

<script>

const API = "https://zkuk3ibhb8.execute-api.ca-central-1.amazonaws.com/prod";


async function addFlight(){

const flightNo=document.getElementById("flight").value;

const destination=document.getElementById("dest").value;

const departure=document.getElementById("time").value;

const res=await fetch(`${API}/flights`,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

flightNo,

destination,

departure

})

});

const data=await res.json();

if(res.ok){

alert("Flight added");

}

else{

alert(data.error);

}

}

</script>

</body>
</html>
