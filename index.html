<!DOCTYPE html>
<html>
<head>
<title>Flights</title>
</head>

<body>

<h2>Available Flights</h2>

<table border="1">

<thead>

<tr>

<th>Flight No</th>
<th>Destination</th>
<th>Departure</th>
<th>Action</th>

</tr>

</thead>

<tbody id="flightList"></tbody>

</table>

<script>

const API = "https://zkuk3ibhb8.execute-api.ca-central-1.amazonaws.com/prod";

const username = localStorage.getItem("username");

if(!username){

alert("Login first");

window.location="login.html";

}

// Load flights
async function loadFlights(){

const res = await fetch(`${API}/flights`);

const flights = await res.json();

const list = document.getElementById("flightList");

list.innerHTML="";

flights.forEach(f=>{

list.innerHTML+=`

<tr>

<td>${f.flightNo}</td>

<td>${f.destination}</td>

<td>${f.departure}</td>

<td>

<button onclick="bookFlight('${f.flightNo}')">

Book

</button>

</td>

</tr>

`;

});

}

loadFlights();


// Book flight

async function bookFlight(flightNo){

await fetch(`${API}/bookings`,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username,

flightNo

})

});

alert("Flight booked");

}

</script>

</body>
</html>
