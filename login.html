<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
width:350px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.toggle-btn{
background:#28a745;
}

.msg{color:red;}
</style>
</head>

<body>

<div class="login-box">

<h2 id="title">User Login</h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<button class="toggle-btn" onclick="toggleMode()">Switch Login Mode</button>

<div class="msg" id="msg"></div>

<a href="signup.html">Create Account</a>

</div>

<script>

let mode = "user";

function toggleMode(){
mode = mode === "user" ? "admin" : "user";
document.getElementById("title").textContent =
mode === "user" ? "User Login" : "Admin Login";
document.getElementById("msg").textContent = "";
}

function login(){

const u = document.getElementById("username").value.trim();
const p = document.getElementById("password").value.trim();
const msg = document.getElementById("msg");

let users = JSON.parse(localStorage.getItem("users")) || [];

// Debug if empty
if(users.length === 0){
msg.textContent = "No users found. Please sign up first.";
return;
}

const account = users.find(x => x.user === u && x.pass === p);

if(!account){
msg.textContent = "Invalid username or password";
return;
}

// ROLE CHECK
if(mode === "admin" && account.role !== "admin"){
msg.textContent = "This account is not Admin";
return;
}

if(mode === "user" && account.role !== "user"){
msg.textContent = "This account is Admin. Switch mode.";
return;
}

// LOGIN SUCCESS
if(account.role === "admin"){
localStorage.setItem("adminLoggedIn","true");
window.location.href = "admin.html";
}

if(account.role === "user"){
localStorage.setItem("loggedIn","true");
localStorage.setItem("currentUser", account.user);
window.location.href = "index.html";
}

}
</script>

</body>
</html>
